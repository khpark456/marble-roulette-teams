name: Deploy to GitHub Pages + Teams package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build web app
        run: |
          yarn install --frozen-lockfile
          yarn build

      # Pages 주소(https://<계정>.github.io/<저장소>/)로 Teams 매니페스트를 채워 zip 을 만든다.
      # 커스텀 도메인을 쓰면 base_url 도 그 도메인으로 나온다.
      - name: Build Teams app package
        env:
          TEAMS_APP_URL: ${{ steps.pages.outputs.base_url }}/
          TEAMS_DEVELOPER_NAME: ${{ github.repository_owner }}
        run: yarn teams:package

      - uses: actions/upload-artifact@v4
        with:
          name: teams-app-package
          path: dist-teams/marble-roulette-teams.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
